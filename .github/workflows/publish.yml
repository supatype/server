# Public self-host only, not used by the cloud repository's Pulumi (see publish-ghcr.yml).
name: Publish to Docker Hub (public supatype/server)

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            supatype/server
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=raw,value=latest

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - run: |
          set -ex

          echo "Adding explicit release version to Dockerfile..."

          sed -i 's/RELEASE_VERSION=unspecified/RELEASE_VERSION=${{ inputs.version }}/' Dockerfile

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The key plugin widget bundles must be signed with, embedded in the server. Fails when
      # the secret is missing, so no image ships that would refuse every widget.
      - name: Release public key
        id: release-key
        env:
          MINISIGN_PUBLIC_KEY: ${{ secrets.MINISIGN_PUBLIC_KEY }}
        run: echo "key=$(bash hack/release-public-key.sh)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            RELEASE_PUBLIC_KEY=${{ steps.release-key.outputs.key }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
