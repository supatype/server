name: Test

on:
  pull_request:
  push:
    branches:
      - main
    tags: ["*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The Valkey client is a wrapper around a real protocol, including a
      # circuit breaker that opens on real failures. Faking valkey-go's Client
      # means reimplementing fifteen methods and constructing ValkeyResults by
      # hand, which tests the fake rather than the wrapper.
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Check gofmt
        run: |
          # Quoted, and tested with -n against a single string. The previous form
          # was `[ ! -z $(gofmt -l .) ]`, which word-splits the file list: with
          # two or more unformatted files it became `[ ! -z f1 f2 ]` and failed
          # with "too many arguments". As an `if` condition a failure reads as
          # false, so the check passed precisely when more files were broken.
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo 'Not gofmt-clean. Run "make format" and commit the result:'
            echo "$unformatted"
            exit 1
          fi
      - name: Check go vet
        run: |
          set -x
          go vet ./...
      - name: Run static check
        run: |
          set -x
          make static
      - name: Check gosec
        run: |
          set -x
          make sec
      - name: Run govulncheck
        run: |
          set -x
          make vulncheck
      - name: Init Database
        run: psql -f hack/init_postgres.sql postgresql://postgres:root@localhost:5432/postgres
      - name: Run migrations
        run: make migrate_dev
      - name: Lint and test
        env:
          # Without a DSN the Studio membership and bootstrap tests skip
          # themselves, so five DB-backed test files never ran in CI. The
          # database is created by hack/init_postgres.sql and is separate from
          # the migrated one on purpose: these tests drop and recreate
          # auth.users, which fails where the auth migrations own it.
          SUPATYPE_TEST_DSN: postgresql://postgres:root@localhost:5432/supatype_studio_test
          # Same reason: without an address the Valkey client's own tests skip
          # and the package cannot reach its floor.
          SUPATYPE_TEST_VALKEY_ADDR: 127.0.0.1:6379
        run: make test
      - name: Cleanup coverage
        run: |
          set -x

          # since Go 1.20 these source files need to be deleted from the
          # coverage profile as they contain legacy or untestable code (like
          # `main` package)

          sed -i '/^github.com\/supatype\/server\/client/d' coverage.out
          sed -i '/^github.com\/supatype\/server\/cmd/d' coverage.out
          sed -i '/^github.com\/supatype\/server\/docs/d' coverage.out
          sed -i '/^github.com\/supatype\/server\/main/d' coverage.out
          sed -i '/^github.com\/supatype\/server\/tools/d' coverage.out

      - uses: shogo82148/actions-goveralls@v1
        with:
          path-to-profile: coverage.out
